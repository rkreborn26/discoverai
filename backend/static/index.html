// ---------------------------------------------------------------
// PLP - lands here from tapping a category tile on the Home page.
// One page per SECTION (Veggies/Fruits/Staples): a left rail lists
// every leaf category in that section, and the right side scrolls
// CONTINUOUSLY through every one of them, one after another - once one
// category's products end, the next category's heading and products
// start right below, same as the Home page's own section list. There's
// no per-click re-fetch/reload; the whole section's data loads once,
// and picking a rail item just smooth-scrolls to that category's block
// already on the page (or jumps there instantly on first load).
//
// The rail mirrors the Home page's pill-nav scrollspy pattern one
// level deeper: an IntersectionObserver keeps the highlighted rail
// item in sync with whichever category block is currently near the
// top of the viewport as the customer scrolls, not just on tap.
//
// The URL still names the selected LEAF category (/category/:categoryId,
// same route a Home tile links to) - picking a different rail item
// updates the URL to that category's id via history.replace (filtering
// within one page, not navigating to a new one).
//
// Two fetches: /api/categories/leaf (lightweight tree, just to work out
// which section this leaf category belongs to) and
// /api/sections/:root_id/products (every leaf category in that section,
// each with its own product list, in one call - not one request per
// category).
// ---------------------------------------------------------------
const DEFAULT_FILTERS = { maxPrice: null, brands: new Set(), organicOnly: false };

function productPassesFilters(product, filters, priceMax) {
  const effectiveMax = filters.maxPrice ?? priceMax;
  if (product.price != null && product.price > effectiveMax) return false;
  if (filters.brands.size > 0 && !filters.brands.has(product.brand)) return false;
  if (filters.organicOnly && !parseOrganicName(product.name).isOrganic) return false;
  return true;
}

// Single horizontal, sticky filter strip at the top of the PLP - three
// chips, no modal/bottom-sheet:
//   Price  - opens a small dropdown with the range slider
//   Brand  - opens a small dropdown with a checkbox list (whatever
//            brands actually appear in this section) - one chip, not
//            one chip per brand, so the strip stays a fixed, short row
//            regardless of how many brands exist
//   Organic - a plain boolean toggle chip, no dropdown needed
// Everything applies live as you tap it.
function PLPFilterBar({ filters, setFilters, priceMax, brandOptions, showOrganic }) {
  const [priceOpen, setPriceOpen] = useState(false);
  const [brandOpen, setBrandOpen] = useState(false);
  const effectiveMax = filters.maxPrice ?? priceMax;
  const priceActive = filters.maxPrice != null && filters.maxPrice < priceMax;
  const activeCount = (priceActive ? 1 : 0) + filters.brands.size + (filters.organicOnly ? 1 : 0);

  const toggleBrand = (brand) => {
    setFilters((f) => {
      const next = new Set(f.brands);
      if (next.has(brand)) next.delete(brand); else next.add(brand);
      return { ...f, brands: next };
    });
  };

  return (
    <div className="plp-filter-strip">
      <div className="plp-filter-chip-wrap">
        <button
          className={"plp-filter-chip" + (priceActive ? " active" : "")}
          onClick={() => setPriceOpen((v) => !v)}
        >
          {priceActive ? `Price: up to ₹${effectiveMax}` : "Price"} ⌄
        </button>
        {priceOpen && (
          <React.Fragment>
            <div className="plp-filter-scrim" onClick={() => setPriceOpen(false)}></div>
            <div className="plp-price-dropdown">
              <div className="plp-price-dropdown-label">Up to ₹{effectiveMax}</div>
              <input
                type="range"
                className="filter-slider"
                min="0"
                max={priceMax}
                value={effectiveMax}
                onChange={(e) => setFilters((f) => ({ ...f, maxPrice: Number(e.target.value) }))}
              />
            </div>
          </React.Fragment>
        )}
      </div>

      {brandOptions.length > 0 && (
        <div className="plp-filter-chip-wrap">
          <button
            className={"plp-filter-chip" + (filters.brands.size > 0 ? " active" : "")}
            onClick={() => setBrandOpen((v) => !v)}
          >
            {filters.brands.size > 0 ? `Brand (${filters.brands.size})` : "Brand"} ⌄
          </button>
          {brandOpen && (
            <React.Fragment>
              <div className="plp-filter-scrim" onClick={() => setBrandOpen(false)}></div>
              <div className="plp-price-dropdown plp-brand-dropdown">
                <div className="plp-price-dropdown-label">Brand</div>
                <div className="plp-brand-list">
                  {brandOptions.map(({ brand, count }) => (
                    <label className="plp-brand-row" key={brand}>
                      <input
                        type="checkbox"
                        checked={filters.brands.has(brand)}
                        onChange={() => toggleBrand(brand)}
                      />
                      {brand} <span className="filter-count">({count})</span>
                    </label>
                  ))}
                </div>
              </div>
            </React.Fragment>
          )}
        </div>
      )}

      {showOrganic && (
        <button
          className={"plp-filter-chip" + (filters.organicOnly ? " active" : "")}
          onClick={() => setFilters((f) => ({ ...f, organicOnly: !f.organicOnly }))}
        >
          Organic
        </button>
      )}

      {activeCount > 0 && (
        <button className="plp-filter-chip plp-filter-clear" onClick={() => setFilters(DEFAULT_FILTERS)}>
          Clear ✕
        </button>
      )}
    </div>
  );
}

// ---------------------------------------------------------------
// Search Results filters - Department (leaf category), Price, and a
// row of attribute chips (Color/Size/Material/Pack Size/Storage/RAM/
// Processor/Organic) that only appear when the CURRENT result set
// actually has values for them. A "rice" search never shows Storage or
// RAM; a phone search never shows Pack Size - each chip's very presence
// is computed from what's on screen, not a fixed schema.
// ---------------------------------------------------------------

// Attributes eligible for a generic checkbox-dropdown chip. Organic is
// deliberately left out of this list - it's boolean, so it gets its own
// plain toggle chip (same treatment as the PLP filter bar) instead of a
// dropdown with a single checkbox in it.
const RESULT_ATTRIBUTE_DEFS = [
  { key: "color", label: "Color" },
  { key: "size", label: "Size" },
  { key: "material", label: "Material" },
  { key: "pack_size", label: "Pack Size" },
  { key: "storage_gb", label: "Storage", suffix: "GB" },
  { key: "ram_gb", label: "RAM", suffix: "GB" },
  { key: "processor", label: "Processor" },
];

// product_attributes.attributes (search.py -> product.custom_attributes)
// is a free-form JSON blob whose KEYS differ per category - fruits/veg
// store "prep_type" (whole/peeled/sliced/diced/...), rice and pulses
// store "variety" and "polish", other categories may have none at all.
// There's no fixed list to define upfront the way RESULT_ATTRIBUTE_DEFS
// is for the structured columns - buildResultFilterMeta discovers
// whatever keys are actually present in the current result set instead,
// which is what makes a "Preparation" chip show up for a produce search
// and stay absent for a rice or electronics search.
const CUSTOM_ATTR_LABEL_OVERRIDES = { prep_type: "Preparation" };

// AI Review Summary's 3 sections - keys match SECTION_KEYS in
// review_summary_routes.py exactly (that's what the API's "praises"/
// "criticism"/"neutral" fields are keyed by); titles/icons are a
// display-only concern that lives here, not the backend, so relabeling
// them later doesn't touch any Python.
const SUMMARY_SECTION_DEFS = [
  { key: "praises", icon: "👍", title: "What Customers Love" },
  { key: "criticism", icon: "👎", title: "What Could Be Better" },
  { key: "neutral", icon: "🤔", title: "Mixed Feedback" },
];

function titleCaseWords(str) {
  return String(str)
    .split(/[_\s]+/)
    .filter(Boolean)
    .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
    .join(" ");
}

function humanizeCustomAttrKey(key) {
  return CUSTOM_ATTR_LABEL_OVERRIDES[key] || titleCaseWords(key);
}

function defaultResultFilters() {
  return { maxPrice: null, departments: new Set(), organicOnly: false, attrs: {} };
}

function resultFiltersActive(filters) {
  return (
    filters.maxPrice != null ||
    filters.departments.size > 0 ||
    filters.organicOnly ||
    Object.values(filters.attrs).some((s) => s && s.size > 0)
  );
}

// Derives every filter chip's option list (and whether it should render
// at all) from the result set currently on screen - departments, the
// price ceiling, which attributes have at least one value, and the
// distinct values for each. Recomputed only when the result set itself
// changes, not on every filter tap.
function buildResultFilterMeta(results) {
  const departments = {};
  const attrCounts = {};
  RESULT_ATTRIBUTE_DEFS.forEach((d) => { attrCounts[d.key] = {}; });
  // Keyed by "custom:<jsonKey>" so a custom attribute can never collide
  // with one of the fixed structured-column keys above.
  const customAttrCounts = {};
  const customAttrLabels = {};
  let anyOrganic = false;
  let maxPrice = 0;

  results.forEach((p) => {
    if (p.price != null && p.price > maxPrice) maxPrice = p.price;
    if (p.organic) anyOrganic = true;
    if (p.category) {
      if (!departments[p.category]) {
        departments[p.category] = { label: p.category.split(" / ").pop(), count: 0 };
      }
      departments[p.category].count += 1;
    }
    RESULT_ATTRIBUTE_DEFS.forEach((d) => {
      const raw = p[d.key];
      if (raw === null || raw === undefined || raw === "") return;
      const label = d.suffix ? `${raw}${d.suffix}` : String(raw);
      attrCounts[d.key][label] = (attrCounts[d.key][label] || 0) + 1;
    });
    if (p.custom_attributes) {
      Object.entries(p.custom_attributes).forEach(([jsonKey, raw]) => {
        if (raw === null || raw === undefined || raw === "") return;
        const fullKey = "custom:" + jsonKey;
        if (!customAttrCounts[fullKey]) {
          customAttrCounts[fullKey] = {};
          customAttrLabels[fullKey] = humanizeCustomAttrKey(jsonKey);
        }
        const label = titleCaseWords(raw);
        customAttrCounts[fullKey][label] = (customAttrCounts[fullKey][label] || 0) + 1;
      });
    }
  });

  const departmentOptions = Object.entries(departments)
    .map(([value, { label, count }]) => ({ value, label, count }))
    .sort((a, b) => a.label.localeCompare(b.label));

  const staticAttributeFilters = RESULT_ATTRIBUTE_DEFS.map((d) => ({
    key: d.key,
    label: d.label,
    options: Object.entries(attrCounts[d.key])
      .map(([value, count]) => ({ value, count }))
      .sort((a, b) => a.value.localeCompare(b.value)),
  })).filter((a) => a.options.length > 0);

  const dynamicAttributeFilters = Object.keys(customAttrCounts)
    .map((fullKey) => ({
      key: fullKey,
      label: customAttrLabels[fullKey],
      options: Object.entries(customAttrCounts[fullKey])
        .map(([value, count]) => ({ value, count }))
        .sort((a, b) => a.value.localeCompare(b.value)),
    }))
    .sort((a, b) => a.label.localeCompare(b.label));

  return {
    departmentOptions,
    attributeFilters: [...staticAttributeFilters, ...dynamicAttributeFilters],
    maxPrice: Math.ceil(maxPrice),
    showOrganic: anyOrganic,
  };
}

function resultPassesFilters(product, filters, priceMax) {
  const effectiveMax = filters.maxPrice ?? priceMax;
  if (product.price != null && product.price > effectiveMax) return false;
  if (filters.departments.size > 0 && !filters.departments.has(product.category)) return false;
  if (filters.organicOnly && !product.organic) return false;

  for (const attr of RESULT_ATTRIBUTE_DEFS) {
    const selected = filters.attrs[attr.key];
    if (!selected || selected.size === 0) continue;
    const raw = product[attr.key];
    if (raw === null || raw === undefined || raw === "") return false;
    const label = attr.suffix ? `${raw}${attr.suffix}` : String(raw);
    if (!selected.has(label)) return false;
  }

  // Dynamic custom-attribute filters ("custom:prep_type", etc.) - keyed
  // separately from RESULT_ATTRIBUTE_DEFS since their set of keys isn't
  // known ahead of time, only discovered per search (see
  // buildResultFilterMeta).
  for (const [fullKey, selected] of Object.entries(filters.attrs)) {
    if (!fullKey.startsWith("custom:") || !selected || selected.size === 0) continue;
    const jsonKey = fullKey.slice(7);
    const raw = product.custom_attributes ? product.custom_attributes[jsonKey] : undefined;
    if (raw === null || raw === undefined || raw === "") return false;
    if (!selected.has(titleCaseWords(raw))) return false;
  }
  return true;
}

function ResultsFilterBar({ filters, setFilters, filterMeta }) {
  // Only one dropdown open at a time, keyed by chip - "dept", "price",
  // or an attribute's key - rather than one boolean per chip, since the
  // attribute chip list is dynamic (unknown length) per search.
  const [openKey, setOpenKey] = useState(null);
  const { departmentOptions, attributeFilters, maxPrice, showOrganic } = filterMeta;

  const effectiveMax = filters.maxPrice ?? maxPrice;
  const priceActive = filters.maxPrice != null && filters.maxPrice < maxPrice;
  const activeAttrCount = Object.values(filters.attrs).reduce((sum, s) => sum + (s ? s.size : 0), 0);
  const activeCount =
    (priceActive ? 1 : 0) + filters.departments.size + (filters.organicOnly ? 1 : 0) + activeAttrCount;

  const toggleDept = (value) => {
    setFilters((f) => {
      const next = new Set(f.departments);
      if (next.has(value)) next.delete(value); else next.add(value);
      return { ...f, departments: next };
    });
  };

  const toggleAttrValue = (attrKey, value) => {
    setFilters((f) => {
      const next = new Set(f.attrs[attrKey] || []);
      if (next.has(value)) next.delete(value); else next.add(value);
      return { ...f, attrs: { ...f.attrs, [attrKey]: next } };
    });
  };

  return (
    <div className="plp-filter-strip">
      {departmentOptions.length > 0 && (
        <div className="plp-filter-chip-wrap">
          <button
            className={"plp-filter-chip" + (filters.departments.size > 0 ? " active" : "")}
            onClick={() => setOpenKey(openKey === "dept" ? null : "dept")}
          >
            {filters.departments.size > 0 ? `Department (${filters.departments.size})` : "Department"} ⌄
          </button>
          {openKey === "dept" && (
            <React.Fragment>
              <div className="plp-filter-scrim" onClick={() => setOpenKey(null)}></div>
              <div className="plp-price-dropdown plp-brand-dropdown">
                <div className="plp-price-dropdown-label">Department</div>
                <div className="plp-brand-list">
                  {departmentOptions.map(({ value, label, count }) => (
                    <label className="plp-brand-row" key={value}>
                      <input
                        type="checkbox"
                        checked={filters.departments.has(value)}
                        onChange={() => toggleDept(value)}
                      />
                      {label} <span className="filter-count">({count})</span>
                    </label>
                  ))}
                </div>
              </div>
            </React.Fragment>
          )}
        </div>
      )}

      <div className="plp-filter-chip-wrap">
        <button
          className={"plp-filter-chip" + (priceActive ? " active" : "")}
          onClick={() => setOpenKey(openKey === "price" ? null : "price")}
        >
          {priceActive ? `Price: up to ₹${effectiveMax}` : "Price"} ⌄
        </button>
        {openKey === "price" && (
          <React.Fragment>
            <div className="plp-filter-scrim" onClick={() => setOpenKey(null)}></div>
            <div className="plp-price-dropdown">
              <div className="plp-price-dropdown-label">Up to ₹{effectiveMax}</div>
              <input
                type="range"
                className="filter-slider"
                min="0"
                max={maxPrice}
                value={effectiveMax}
                onChange={(e) => setFilters((f) => ({ ...f, maxPrice: Number(e.target.value) }))}
              />
            </div>
          </React.Fragment>
        )}
      </div>

      {attributeFilters.map((attr) => {
        const selected = filters.attrs[attr.key] || new Set();
        return (
          <div className="plp-filter-chip-wrap" key={attr.key}>
            <button
              className={"plp-filter-chip" + (selected.size > 0 ? " active" : "")}
              onClick={() => setOpenKey(openKey === attr.key ? null : attr.key)}
            >
              {selected.size > 0 ? `${attr.label} (${selected.size})` : attr.label} ⌄
            </button>
            {openKey === attr.key && (
              <React.Fragment>
                <div className="plp-filter-scrim" onClick={() => setOpenKey(null)}></div>
                <div className="plp-price-dropdown plp-brand-dropdown">
                  <div className="plp-price-dropdown-label">{attr.label}</div>
                  <div className="plp-brand-list">
                    {attr.options.map(({ value, count }) => (
                      <label className="plp-brand-row" key={value}>
                        <input
                          type="checkbox"
                          checked={selected.has(value)}
                          onChange={() => toggleAttrValue(attr.key, value)}
                        />
                        {value} <span className="filter-count">({count})</span>
                      </label>
                    ))}
                  </div>
                </div>
              </React.Fragment>
            )}
          </div>
        );
      })}

      {showOrganic && (
        <button
          className={"plp-filter-chip" + (filters.organicOnly ? " active" : "")}
          onClick={() => setFilters((f) => ({ ...f, organicOnly: !f.organicOnly }))}
        >
          Organic
        </button>
      )}

      {activeCount > 0 && (
        <button className="plp-filter-chip plp-filter-clear" onClick={() => setFilters(defaultResultFilters())}>
          Clear ✕
        </button>
      )}
    </div>
  );
}

function PLPPage() {
  const navigate = useNavigate();
  const { categoryId } = useParams();

  const [sections, setSections] = useState(null);
  const [sectionsError, setSectionsError] = useState(false);

  const [sectionData, setSectionData] = useState(null);
  const [sectionDataError, setSectionDataError] = useState(false);

  const [activeCategoryId, setActiveCategoryId] = useState(categoryId);
  const categoryRefs = useRef({});
  const didInitialScroll = useRef(false);

  const [filters, setFilters] = useState(DEFAULT_FILTERS);

  useEffect(() => {
    fetch("/api/categories/leaf")
      .then((res) => res.json())
      .then((data) => setSections(data.sections || []))
      .catch(() => setSectionsError(true));
  }, []);

  const currentSection = sections && sections.find((s) => s.categories.some((c) => c.id === categoryId));
  const rootId = currentSection ? currentSection.root_category_id : null;

  // Loads once per SECTION, not per leaf category - clicking sibling
  // categories in the rail never re-triggers this.
  useEffect(() => {
    if (!rootId) return;
    setSectionData(null);
    setSectionDataError(false);
    setFilters(DEFAULT_FILTERS);
    didInitialScroll.current = false;
    fetch(`/api/sections/${rootId}/products`)
      .then((res) => res.json())
      .then((data) => setSectionData(data))
      .catch(() => setSectionDataError(true));
  }, [rootId]);

  const categoriesWithProducts = sectionData
    ? sectionData.categories.filter((c) => c.products.length > 0)
    : null;

  // Filter option ranges/lists are derived from the WHOLE section (not
  // just the currently-scrolled-to category), since one filter panel
  // covers the entire continuous-scroll page. Recomputed only when the
  // underlying product data changes, not on every filter toggle.
  const { priceMax, brandOptions, showOrganic } = useMemo(() => {
    if (!categoriesWithProducts) return { priceMax: 0, brandOptions: [], showOrganic: false };
    const allProducts = categoriesWithProducts.flatMap((c) => c.products);
    const max = allProducts.reduce((m, p) => (p.price != null && p.price > m ? p.price : m), 0);
    const brandCounts = {};
    let anyOrganic = false;
    allProducts.forEach((p) => {
      brandCounts[p.brand] = (brandCounts[p.brand] || 0) + 1;
      if (parseOrganicName(p.name).isOrganic) anyOrganic = true;
    });
    const brands = Object.keys(brandCounts)
      .sort((a, b) => a.localeCompare(b))
      .map((brand) => ({ brand, count: brandCounts[brand] }));
    return { priceMax: Math.ceil(max), brandOptions: brands, showOrganic: anyOrganic };
  }, [categoriesWithProducts]);

  // Every category's products run through the active filters; a
  // category whose products are all filtered out simply doesn't render
  // its heading/grid, but the rail on the left is unaffected - it
  // always lists every leaf category in the section, filters or not.
  const filteredCategories = categoriesWithProducts
    ? categoriesWithProducts
        .map((cat) => ({ ...cat, products: cat.products.filter((p) => productPassesFilters(p, filters, priceMax)) }))
        .filter((cat) => cat.products.length > 0)
    : null;

  // Land directly on the tapped category's block - instantly, not
  // animated - the first time this section's data arrives. Rail clicks
  // scroll themselves imperatively, so this only needs to run once per
  // section load, not on every categoryId change.
  useEffect(() => {
    if (!categoriesWithProducts || didInitialScroll.current) return;
    const el = categoryRefs.current[categoryId];
    if (el) el.scrollIntoView({ behavior: "auto", block: "start" });
    didInitialScroll.current = true;
  }, [categoriesWithProducts]);

  // Scrollspy - keep the rail's highlighted item synced with whichever
  // category block is currently near the top of the viewport as the
  // customer scrolls manually, not just on rail tap. Re-runs whenever
  // the FILTERED set changes too, since filtering can remove/restore
  // category blocks from the DOM.
  useEffect(() => {
    if (!filteredCategories) return;
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) setActiveCategoryId(entry.target.dataset.categoryId);
        });
      },
      { rootMargin: "-120px 0px -70% 0px", threshold: 0 }
    );
    Object.values(categoryRefs.current).forEach((el) => el && observer.observe(el));
    return () => observer.disconnect();
  }, [filteredCategories]);

  const selectCategory = (id) => {
    setActiveCategoryId(id);
    navigate(`/category/${id}`, { replace: true });
    const el = categoryRefs.current[id];
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  return (
    <div className="app-frame">
      <div className="home-top" style={{ paddingBottom: 16 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <button className="back-arrow" onClick={() => navigate("/")}>‹</button>
            <h2 style={{ color: "white", fontSize: "1.1em", margin: 0 }}>
              {currentSection ? currentSection.name : "Category"}
            </h2>
          </div>
          <CartIconButton navigate={navigate} />
        </div>
      </div>

      {categoriesWithProducts && categoriesWithProducts.length > 0 && (
        <div className="plp-filter-bar">
          <PLPFilterBar
            filters={filters}
            setFilters={setFilters}
            priceMax={priceMax}
            brandOptions={brandOptions}
            showOrganic={showOrganic}
          />
        </div>
      )}

      <div className="plp-body">
        <div className="plp-sidebar">
          {sectionsError && <div className="plp-sidebar-empty">⚠️</div>}
          {!sectionsError && !categoriesWithProducts && <div className="plp-sidebar-empty">Loading...</div>}
          {categoriesWithProducts && categoriesWithProducts.map((cat) => (
            <div
              key={cat.id}
              className={"plp-sidebar-item" + (cat.id === activeCategoryId ? " active" : "")}
              onClick={() => selectCategory(cat.id)}
            >
              {cat.icon_url ? (
                <img src={cat.icon_url} alt="" />
              ) : (
                <span className="plp-sidebar-fallback">{cat.name.charAt(0)}</span>
              )}
              <span className="plp-sidebar-label">{cat.name}</span>
            </div>
          ))}
        </div>

        <div className="plp-main">
          {sectionDataError && <div className="home-empty">Couldn't load this section. Is the backend running?</div>}
          {!sectionDataError && !categoriesWithProducts && <div className="home-loading">Loading products...</div>}
          {categoriesWithProducts && categoriesWithProducts.length === 0 && (
            <div className="home-empty">No products in this section yet.</div>
          )}
          {categoriesWithProducts && categoriesWithProducts.length > 0 && filteredCategories.length === 0 && (
            <div className="home-empty">No products match your filters.</div>
          )}

          {filteredCategories && filteredCategories.map((cat) => (
            <div
              key={cat.id}
              data-category-id={cat.id}
              ref={(el) => { categoryRefs.current[cat.id] = el; }}
            >
              <div className="plp-category-heading">{cat.name}</div>
              <div className="plp-grid">
                {cat.products.map((product, idx) => (
                  <PLPProductCard
                    key={product.id}
                    product={product}
                    categoryName={cat.name}
                    position={idx + 1}
                  />
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="bottom-nav-spacer" />
      <BottomNav active={null} navigate={navigate} />
    </div>
  );
}

    return PERSONAS.find((p) => p.id === parsed.id) || null;
  } catch (e) {

function storePersona(persona) {
  try {
    localStorage.setItem(PERSONA_STORAGE_KEY, JSON.stringify({ id: persona.id }));

// Rate & Review form - mirrors the exact rules reviews_routes.py's
// submit_review() enforces server-side, so the UI never lets a
// shopper hit a validation error that wasn't already visible here:
// rating is always required; a rating of 3 or below requires review
// text (a "reason"); anything WITH text goes to moderation, a pure
// rating (no text) is approved instantly. One review per persona per
// product - resubmitting overwrites the previous one (see the
// ON CONFLICT upsert in submit_review()), so this form doesn't need
// to know whether the shopper already reviewed this product.
// Product decision (matches reviews_routes.py's MAX_IMAGES/MAX_TOTAL_IMAGE_BYTES
// exactly - keep these two in sync): up to 5 photos per review, 5MB
// COMBINED, not per-image.
const MAX_REVIEW_IMAGES = 5;
const MAX_REVIEW_IMAGES_BYTES = 5 * 1024 * 1024;

function ReviewForm({ productId, onSubmitted }) {
  const { persona } = usePersona();
  const [rating, setRating] = useState(0);
  const [reviewText, setReviewText] = useState("");
  const [images, setImages] = useState([]); // File[]
  const [imageError, setImageError] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [result, setResult] = useState(null); // { status } | { error }

  // One object URL per selected file, for the thumbnail previews - built
  // once per `images` change (not on every render) and revoked on
  // cleanup so picking/removing photos repeatedly doesn't leak memory.
  const previewUrls = useMemo(() => images.map((f) => URL.createObjectURL(f)), [images]);
  useEffect(() => {
    return () => { previewUrls.forEach((u) => URL.revokeObjectURL(u)); };
  }, [previewUrls]);

  const reasonRequired = rating > 0 && rating <= 3;
  const totalImageBytes = images.reduce((sum, f) => sum + f.size, 0);
  const canSubmit = rating > 0 && !submitting && (!reasonRequired || reviewText.trim().length > 0);

  const handleFilesSelected = (e) => {
    const picked = Array.from(e.target.files || []);
    e.target.value = ""; // lets the same file be re-picked later if removed
    if (picked.length === 0) return;

    const combined = [...images, ...picked];
    if (combined.length > MAX_REVIEW_IMAGES) {
      setImageError(`You can attach up to ${MAX_REVIEW_IMAGES} photos.`);
      return;
    }
    const combinedBytes = combined.reduce((sum, f) => sum + f.size, 0);
    if (combinedBytes > MAX_REVIEW_IMAGES_BYTES) {
      setImageError("Photos must be 5MB or less combined.");
      return;
    }
    setImageError(null);
    setImages(combined);
  };

  const removeImage = (index) => {
    setImageError(null);
    setImages((prev) => prev.filter((_, i) => i !== index));
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!canSubmit) return;
    setSubmitting(true);
    setResult(null);

    // multipart/form-data (not JSON) so the photos can ride along in the
    // same request - see reviews_routes.py's submit_review().
    const formData = new FormData();
    formData.append("persona_id", persona.id);
    formData.append("rating", String(rating));
    if (reviewText.trim()) formData.append("review_text", reviewText.trim());
    images.forEach((file) => formData.append("images", file));

    fetch(`/api/products/${encodeURIComponent(productId)}/reviews`, {
      method: "POST",
      body: formData,
    })
      .then((res) => res.json().then((body) => ({ ok: res.ok, body })))
      .then(({ ok, body }) => {
        if (!ok) {
          setResult({ error: body.error || "Couldn't submit your review." });
          return;
        }
        setResult({ status: body.review.status });
        setRating(0);
        setReviewText("");
        setImages([]);
        if (onSubmitted) onSubmitted();
      })
      .catch(() => setResult({ error: "Couldn't submit your review. Please try again." }))
      .finally(() => setSubmitting(false));
  };

  return (
    <div className="pdp-section pdp-review-form">
      <div className="checkout-section-title">Rate this product</div>
      <form onSubmit={handleSubmit}>
        <StarPicker value={rating} onChange={(n) => { setRating(n); setResult(null); }} />

        {rating > 0 && (
          <React.Fragment>
            <textarea
              className="pdp-review-textarea"
              placeholder={
                reasonRequired
                  ? "A rating of 3 stars or below needs a reason - what went wrong?"
                  : "Add a written review (optional)"
              }
              value={reviewText}
              onChange={(e) => setReviewText(e.target.value)}
              rows={3}
            />

            <div className="pdp-review-photo-row">
              {images.map((file, i) => (
                <div className="pdp-review-photo-thumb" key={i}>
                  <img src={previewUrls[i]} alt={`Photo ${i + 1}`} />
                  <button type="button" className="pdp-review-photo-remove" onClick={() => removeImage(i)}>
                    ×
                  </button>
                </div>
              ))}
              {images.length < MAX_REVIEW_IMAGES && (
                <label className="pdp-review-photo-add">
                  📷
                  <input type="file" accept="image/*" multiple hidden onChange={handleFilesSelected} />
                </label>
              )}
            </div>
            <div className="pdp-review-photo-hint">
              Up to {MAX_REVIEW_IMAGES} photos, 5MB combined
              {images.length > 0 ? ` (${(totalImageBytes / (1024 * 1024)).toFixed(1)}MB used)` : ""}.
            </div>
            {imageError && <div className="pdp-review-hint">{imageError}</div>}
          </React.Fragment>
        )}
        {reasonRequired && (
          <div className="pdp-review-hint">A reason is required for a rating of 3 stars or below.</div>
        )}

        {result && result.error && <div className="pdp-review-error">{result.error}</div>}
        {result && result.status === "approved" && (
          <div className="pdp-review-success">Thanks! Your rating is live.</div>
        )}
        {result && result.status === "submitted" && (
          <div className="pdp-review-success">
            Thanks! Your review is awaiting moderation and will appear once approved.
          </div>
        )}

        <button type="submit" className="plp-add-btn pdp-review-submit" disabled={!canSubmit}>
          {submitting ? "Submitting..." : "Submit"}
        </button>
      </form>
    </div>
  );
}

// One approved, written review on the PDP - persona name/avatar looked

// ---------------------------------------------------------------
// Product Detail Page - lands here from tapping any product card
// anywhere in the app (Home/PLP/Search Results all link the same way,
// via /product/:productId - see PLPProductCard's and ResultCard's
// onClick). Built from fields already proven out elsewhere: image_url
// + fallback (PLPProductCard), organic/pack-size parsing
// (parseOrganicName/stripPackSize), the dynamic attribute-labeling
// helper built for the Search Results filter bar
// (humanizeCustomAttrKey - so a value like prep_type shows the same
// "Preparation" label here as it does there), and the real Add to Cart
// control (AddToCartControl). Backed by GET /api/products/:id, which
// also returns a handful of related products from the same leaf
// category so browsing doesn't dead-end on this page.
// ---------------------------------------------------------------
function ProductDetailPage() {
  const navigate = useNavigate();
  const { productId } = useParams();
  const [data, setData] = useState(null);
  const [error, setError] = useState(false);
  const [imgError, setImgError] = useState(false);

  const loadProduct = useCallback(() => {
    fetch(`/api/products/${encodeURIComponent(productId)}`)
      .then((res) => {
        if (!res.ok) throw new Error("Product not found.");
        return res.json();
      })
      .then((d) => setData(d))
      .catch(() => setError(true));
  }, [productId]);

  useEffect(() => {
    setData(null);
    setError(false);
    setImgError(false);
    window.scrollTo(0, 0);
    loadProduct();
  }, [productId]);

  const product = data && data.product;
  const related = (data && data.related_products) || [];
  const reviewsList = (data && data.reviews) || [];
  const ratingSummary = data && data.rating_summary;
  const reviewSummary = data && data.review_summary; // {praises, criticism, neutral} or null

  const organicParsed = product ? parseOrganicName(product.name) : null;
  const displayName = product ? stripPackSize(organicParsed.displayName, product.pack_size) : "";
  const isOrganic = product ? (organicParsed.isOrganic || product.organic) : false;
  const showImage = product && product.image_url && !imgError;

  // Same idea as Search Results' dynamic filter chips (RESULT_ATTRIBUTE_DEFS),
  // plus whatever's in the free-form custom_attributes JSON - so a fact
  // shown as a filter chip elsewhere in the app also shows up here as a
  // labeled spec row.
  const specRows = [];
  if (product) {
    if (product.pack_size) specRows.push(["Pack Size", product.pack_size]);
    if (product.color) specRows.push(["Color", product.color]);
    if (product.size) specRows.push(["Size", product.size]);
    if (product.material) specRows.push(["Material", product.material]);
    if (product.fit_type) specRows.push(["Fit", product.fit_type]);
    if (product.storage_gb) specRows.push(["Storage", `${product.storage_gb}GB`]);
    if (product.ram_gb) specRows.push(["RAM", `${product.ram_gb}GB`]);
    if (product.processor) specRows.push(["Processor", product.processor]);
    if (product.display_size_inch) specRows.push(["Display", `${product.display_size_inch}"`]);
    if (product.connectivity_5g) specRows.push(["Connectivity", "5G"]);
    Object.entries(product.custom_attributes || {}).forEach(([key, value]) => {
      if (value === null || value === undefined || value === "") return;
      specRows.push([humanizeCustomAttrKey(key), String(value)]);
    });
  }

  return (
    <div className="app-frame">
      <div className="app-top" style={{ paddingBottom: 16 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <button className="back-arrow" onClick={() => navigate(-1)}>‹</button>
            <h2 style={{ color: "white", fontSize: "1.1em", margin: 0 }}>Product Details</h2>
          </div>
          <CartIconButton navigate={navigate} />
        </div>
      </div>

      {error && <div className="home-empty">Couldn't find that product.</div>}
      {!error && !product && <div className="home-loading">Loading product...</div>}

      {product && (
        <React.Fragment>
          {product.category && product.category.path && (
            <div className="pdp-breadcrumb">{product.category.path}</div>
          )}

          {showImage ? (
            <img
              className="pdp-hero-image"
              src={product.image_url}
              alt={displayName}
              onError={() => setImgError(true)}
            />
          ) : (
            <div className="pdp-hero-image pdp-hero-image-fallback">{displayName.charAt(0)}</div>
          )}

          <div className="pdp-info">
            {isOrganic && <span className="organic-badge pdp-organic-badge">🌿 Organic</span>}
            <div className="plp-card-brand">{product.brand}</div>
            <h1 className="pdp-title">{displayName}</h1>

            {ratingSummary && ratingSummary.count > 0 ? (
              <div className="pdp-rating-row">
                <span className="pdp-rating">★ {ratingSummary.average.toFixed(1)}</span>
                <span className="pdp-review-count">
                  ({ratingSummary.count} rating{ratingSummary.count === 1 ? "" : "s"})
                </span>
              </div>
            ) : (
              <div className="pdp-rating-row">
                <span className="pdp-review-count">No ratings yet - be the first to rate this product.</span>
              </div>
            )}

            <div className="pdp-price-row">
              <span className="pdp-price">₹{product.price}</span>
              {product.original_price && product.original_price > product.price && (
                <span className="pdp-original-price">₹{product.original_price}</span>
              )}
              {product.discount_percentage > 0 && (
                <span className="pdp-discount-badge">{product.discount_percentage}% OFF</span>
              )}
            </div>

            <div className={"pdp-stock-line" + (product.in_stock ? "" : " out")}>
              {product.in_stock ? "In stock" : "Out of stock"}
            </div>

            <div className="pdp-add-row">
              <AddToCartControl
                productId={product.id}
                inStock={product.in_stock}
                onLogAdd={() => logEvent("add-to-cart", { query_text: "pdp", product_id: product.id })}
              />
            </div>

            {product.description && (
              <div className="pdp-section">
                <div className="checkout-section-title">Description</div>
                <p className="pdp-description">{product.description}</p>
              </div>
            )}

            {specRows.length > 0 && (
              <div className="pdp-section">
                <div className="checkout-section-title">Specifications</div>
                <div className="pdp-spec-table">
                  {specRows.map(([label, value]) => (
                    <div className="pdp-spec-row" key={label}>
                      <span className="pdp-spec-label">{label}</span>
                      <span className="pdp-spec-value">{value}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <ReviewForm productId={product.id} onSubmitted={loadProduct} />
          </div>

          {reviewSummary && (
            <div className="pdp-section pdp-related-section pdp-ai-summary">
              <div className="checkout-section-title" style={{ padding: "0 16px" }}>
                ✨ What customers are saying
              </div>
              {SUMMARY_SECTION_DEFS.map((def) => (
                reviewSummary[def.key] ? (
                  <div className="pdp-ai-summary-block" key={def.key}>
                    <div className="pdp-ai-summary-heading">{def.icon} {def.title}</div>
                    <p className="pdp-ai-summary-text">{reviewSummary[def.key]}</p>
                  </div>
                ) : null
              ))}
            </div>
          )}

          {reviewsList.length > 0 && (
            <div className="pdp-section pdp-related-section">
              <div className="checkout-section-title" style={{ padding: "0 16px" }}>Customer Reviews</div>
              <div className="pdp-review-list">
                {reviewsList.map((r) => (
                  <ReviewCard key={r.id} review={r} />
                ))}
              </div>
            </div>
          )}

          {related.length > 0 && (
            <div className="pdp-section pdp-related-section">
              <div className="checkout-section-title" style={{ padding: "0 16px" }}>You may also like</div>
              <div className="pdp-related-scroll">
                {related.map((p) => (
                  <RelatedProductCard key={p.id} product={p} />
                ))}
              </div>
            </div>
          )}

          <div className="bottom-nav-spacer" />
        </React.Fragment>
      )}
    </div>
  );
}

// ---------------------------------------------------------------
// Review Moderation - the Retailer Admin side of the Ratings & Reviews
// module (see reviews_routes.py). Reachable at /admin/reviews, same
// ungated pattern as /admin itself (see App() below - checked via the
// raw URL, no persona/router needed). Three tabs mirror the review
// lifecycle exactly: Submitted (awaiting a decision - the actual
// queue), Approved, Rejected. Only a Submitted review has
// Approve/Reject actions; Approved/Rejected are read-only history.
// Rejecting requires picking one of the three fixed reasons product
// asked for - there's no free-text rejection, so every rejection is
// consistently categorized for later analysis.
// ---------------------------------------------------------------
// Live "how this works" popup for AI Moderation - same pattern as the
// Review Summary one (see ReviewSummaryFlowDiagram/runFlowAnimated
// above): a separate BroadcastChannel so this doesn't cross-talk with
// that other feature's channel, a static step diagram, and helpers that
// light up a step in real time as an actual Run AI Moderation /
// Evaluate AI Accuracy click happens - not a separate simulated replay.
const MODERATION_FLOW_CHANNEL = "moderation-flow";

function broadcastModerationFlowStep(step) {
  if (typeof BroadcastChannel === "undefined") return;
  try {
    const bc = new BroadcastChannel(MODERATION_FLOW_CHANNEL);
    bc.postMessage({ step });
    bc.close();
  } catch (e) {
    // ignore - purely a nice-to-have visualization, never block the real action
  }
}

function runModerationFlowAnimated(fetchPromise) {
  broadcastModerationFlowStep(0);
  const toFlask = setTimeout(() => broadcastModerationFlowStep(1), 200);
  const toAgents = setTimeout(() => broadcastModerationFlowStep(2), 550);
  return fetchPromise.finally(() => {
    clearTimeout(toFlask);
    clearTimeout(toAgents);
    broadcastModerationFlowStep(3);
    setTimeout(() => broadcastModerationFlowStep(null), 1800);
  });
}

const MODERATION_FLOW_STEPS = [
  {
    icon: "🖥️",
    title: "1. Frontend (Review Moderation page)",
    points: [
      "You click Run AI Moderation / Re-run on one review, Run AI Moderation Now for the Submitted queue, or Evaluate AI Accuracy for Approved + Rejected.",
      "The browser sends the review id (or nothing, for a batch run) to the Flask API and waits.",
      "Once Flask responds, it renders the AI Moderation badge, note, and (for a batch) the result summary.",
    ],
  },
  {
    icon: "🐍",
    title: "2. Flask API (moderation_routes.py)",
    points: [
      "Loads the review's product name, star rating, review text, and any attached photos.",
      "Checks recent order history for Velocity/Fraud - this one is pure SQL, no OpenAI call at all.",
      "Dispatches the remaining agents together for this review, not one after another.",
    ],
  },
  {
    icon: "🤖",
    title: "3. OpenAI API (gpt-4o-mini) - up to 3 calls",
    points: [
      "Text Moderation: one call covering profanity, relevance, spam, and personal info together.",
      "Hate Speech: its own separate call - kept isolated so tuning it can't quietly shift the other categories.",
      "Image Policy: only if the review has photos attached - a vision call checking the actual images.",
    ],
  },
  {
    icon: "💾",
    title: "4. Back in Flask, once every agent responds",
    points: [
      "Combines every verdict using a fixed priority order (hate speech first, then profanity, personal info, image policy, spam, relevance).",
      "Saves the decision, reason, note, confidence, AND the full raw trace from every agent - nothing is discarded.",
      "Sends the result back to the browser, which renders it as the AI Moderation badge.",
    ],
  },
];

function ModerationFlowDiagram({ activeStep }) {
  return (
    <div className="rs-flow">
      {MODERATION_FLOW_STEPS.map((step, i) => (
        <React.Fragment key={step.title}>
          <div className={"rs-flow-step" + (activeStep === i ? " rs-flow-step-active" : "")}>
            <div className="rs-flow-icon">{step.icon}</div>
            <div className="rs-flow-body">
              <div className="rs-flow-title">{step.title}</div>
              <ul className="rs-flow-points">
                {step.points.map((p) => <li key={p}>{p}</li>)}
              </ul>
            </div>
          </div>
          {i < MODERATION_FLOW_STEPS.length - 1 && <div className="rs-flow-arrow">↓</div>}
        </React.Fragment>
      ))}
    </div>
  );
}

// Standalone page for /admin/reviews/how-it-works - opened in a separate
// popup window (see the "Show how this works" button in
// ReviewModerationPage) so it can stay open side-by-side while you
// actually click around the moderation queue.
function ModerationFlowPage() {
  const [activeStep, setActiveStep] = useState(null);

  useEffect(() => {
    if (typeof BroadcastChannel === "undefined") return undefined;
    const bc = new BroadcastChannel(MODERATION_FLOW_CHANNEL);
    bc.onmessage = (event) => {
      const step = event && event.data ? event.data.step : null;
      setActiveStep(typeof step === "number" ? step : null);
    };
    return () => bc.close();
  }, []);

  return (
    <div className="app-frame">
      <div className="home-top" style={{ paddingBottom: 16 }}>
        <div className="persona-select-title" style={{ textAlign: "left", marginTop: 10 }}>
          How AI Moderation works

        <div className="persona-select-subtitle" style={{ textAlign: "left" }}>
          {activeStep === null
            ? "Waiting for you to click Run AI Moderation on the review page..."
            : `Live: step ${activeStep + 1} of ${MODERATION_FLOW_STEPS.length} is happening right now.`}
        </div>
      </div>
      <div className="admin-review-list">
        <div className="admin-review-card">
          <ModerationFlowDiagram activeStep={activeStep} />
        </div>
      </div>
    </div>
  );
}

const REVIEW_TABS = [
  { key: "submitted", label: "Submitted" },
  { key: "approved", label: "Approved" },
  { key: "rejected", label: "Rejected" },
];

const REJECTION_REASONS = [
  { value: "profanity", label: "Profanity or abusive language" },
  { value: "hate_speech", label: "Hate speech or discrimination" },
  { value: "not_relevant", label: "Not relevant to this product (delivery/other product issue)" },
  { value: "needs_human_review", label: "Suggest further human review" },
  { value: "spam", label: "Spam / fake or incentivized review" },

];

function AdminReviewCard({ review, onApprove, onReject, onResubmit, onRunAi, onAcceptAi }) {
  const [rejecting, setRejecting] = useState(false);
  const [reason, setReason] = useState("");
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false);
  const [aiBusy, setAiBusy] = useState(false);

  const isOther = reason === "other";
  const canConfirmReject = reason && (!isOther || note.trim().length > 0) && !busy;

  const submitReject = () => {
    if (!canConfirmReject) return;
    setBusy(true);
    onReject(review.id, reason, isOther ? note.trim() : null).finally(() => setBusy(false));
  };

  const handleResubmit = () => {
    if (busy) return;
    setBusy(true);
    onResubmit(review.id).finally(() => setBusy(false));
  };

  const handleRunAi = () => {
    if (aiBusy) return;
    setAiBusy(true);
    onRunAi(review.id).finally(() => setAiBusy(false));
  };

  const handleAcceptAi = () => {
    if (aiBusy) return;
    setAiBusy(true);
    onAcceptAi(review.id).finally(() => setAiBusy(false));
  };

  return (
    <div className="admin-review-card">
      <div className="admin-review-card-top">
        {review.product_image_url ? (
          <img className="admin-review-thumb" src={review.product_image_url} alt={review.product_name} />
        ) : (
          <div className="admin-review-thumb admin-review-thumb-fallback">
            {(review.product_name || "?").charAt(0)}
          </div>
        )}
        <div className="admin-review-meta">
          <div className="admin-review-product">{review.product_name}</div>
          <div className="admin-review-persona">
            {(PERSONAS.find((p) => p.id === review.persona_id) || {}).name || review.persona_id}
            {" · "}
            {review.created_at ? new Date(review.created_at).toLocaleDateString() : ""}
          </div>
        </div>
        <span className="pdp-review-stars">
          {"★".repeat(review.rating)}{"☆".repeat(5 - review.rating)}
        </span>
      </div>

      <p className="admin-review-text">
        {review.review_text || <em>(No written review - rating only)</em>}
      </p>

      {(review.images || []).length > 0 && (
        <div className="pdp-review-image-row">
          {review.images.map((img) => (
            <a href={img.image_url} target="_blank" rel="noreferrer" key={img.id}>
              <img className="pdp-review-image-thumb" src={img.image_url} alt="Review photo" />
            </a>
          ))}
        </div>
      )}

      {review.ai_decision && (
        <div className={"ai-mod-badge " + (review.ai_decision === "approved" ? "ai-mod-badge-approved" : "ai-mod-badge-rejected")}>
          <div className="ai-mod-badge-title">
            🤖 AI Moderation: {review.ai_decision === "approved"
              ? "Approved"
              : `Rejected — ${review.ai_rejection_reason_label || review.ai_rejection_reason}`}
          </div>
          {review.ai_decision === "rejected" && review.ai_note && (
            <div className="ai-mod-badge-note">{review.ai_note}</div>
          )}
        </div>
      )}

      {review.status === "rejected" && review.rejection_reason_label && (
        <div className="admin-review-rejection-tag">
          Rejected: {review.rejection_reason_label}
          {review.rejection_note ? ` - ${review.rejection_note}` : ""}
        </div>
      )}

      {(review.status === "approved" || review.status === "rejected") && (
        <div className="admin-review-actions">
          {(review.moderator_agreed === true || review.moderator_agreed === false) && (
            <span className={"ai-agree-tag " + (review.moderator_agreed ? "ai-agree-tag-yes" : "ai-agree-tag-no")}>
              {review.moderator_agreed ? "✓ You agreed with AI" : "✗ You overrode AI"}
            </span>
          )}
          <button className="admin-resubmit-btn" disabled={busy} onClick={handleResubmit}>
            {busy ? "Sending..." : "Send to Moderation again"}
          </button>
        </div>
      )}

      {review.status === "submitted" && !rejecting && (
        <div className="admin-review-actions">
          {review.ai_decision && (
            <button className="admin-approve-btn" disabled={aiBusy} onClick={handleAcceptAi}>
              {aiBusy ? "..." : "Accept AI Decision"}
            </button>
          )}
          <button className="admin-approve-btn" onClick={() => onApprove(review.id)}>Approve</button>
          <button className="admin-reject-btn" onClick={() => setRejecting(true)}>Reject</button>
          <button className="admin-resubmit-btn" disabled={aiBusy} onClick={handleRunAi}>
            {aiBusy ? "Running..." : review.ai_decision ? "Re-run AI Moderation" : "Run AI Moderation"}
          </button>
        </div>
      )}

      {review.status === "submitted" && rejecting && (
        <div className="admin-reject-panel">
          {REJECTION_REASONS.map((r) => (
            <label className="admin-reject-reason" key={r.value}>
              <input
                type="radio"
                name={`reject-${review.id}`}
                value={r.value}
                checked={reason === r.value}
                onChange={() => setReason(r.value)}
              />
              {r.label}
            </label>
          ))}
          {isOther && (
            <textarea
              className="pdp-review-textarea"
              placeholder="Describe the reason - required for Other"
              value={note}
              onChange={(e) => setNote(e.target.value)}
              rows={2}
            />
          )}
          <div className="admin-review-actions">
            <button className="admin-reject-btn" disabled={!canConfirmReject} onClick={submitReject}>
              {busy ? "Rejecting..." : "Confirm Reject"}
            </button>
            <button
              className="admin-cancel-btn"
              onClick={() => { setRejecting(false); setReason(""); setNote(""); }}
            >
              Cancel
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function ReviewModerationPage() {
  const [tab, setTab] = useState("submitted");
  const [reviewsList, setReviewsList] = useState(null);
  const [error, setError] = useState(false);
  const [batchAiBusy, setBatchAiBusy] = useState(false);
  const [batchAiResult, setBatchAiResult] = useState(null);
  const [forceRerunSubmitted, setForceRerunSubmitted] = useState(false);
  const [evalBusy, setEvalBusy] = useState(false);
  const [evalResult, setEvalResult] = useState(null);

  const load = useCallback(() => {
    setReviewsList(null);
    setError(false);
    fetch(`/api/admin/reviews?status=${encodeURIComponent(tab)}`)
      .then((res) => {
        if (!res.ok) throw new Error("Failed to load reviews.");
        return res.json();
      })
      .then((data) => setReviewsList(data.reviews || []))
      .catch(() => setError(true));
  }, [tab]);

  useEffect(() => {
    load();
  }, [load]);

  const handleApprove = (reviewId) =>
    fetch(`/api/admin/reviews/${encodeURIComponent(reviewId)}/approve`, { method: "POST" })
      .then(() => load());

  const handleReject = (reviewId, reason, note) =>
    fetch(`/api/admin/reviews/${encodeURIComponent(reviewId)}/reject`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ reason, note }),
    }).then(() => load());

  const handleResubmit = (reviewId) =>
    fetch(`/api/admin/reviews/${encodeURIComponent(reviewId)}/resubmit`, { method: "POST" })
      .then(() => load());

  const handleRunAi = (reviewId) =>
    runModerationFlowAnimated(fetch(`/api/admin/reviews/${encodeURIComponent(reviewId)}/moderate`, { method: "POST" }))
      .then((res) => res.json().then((body) => ({ ok: res.ok, body })))
      .then(({ ok, body }) => {
        if (!ok) throw new Error(body.error || "AI moderation failed.");
        return load();
      });

  const handleAcceptAi = (reviewId) =>
    fetch(`/api/admin/reviews/${encodeURIComponent(reviewId)}/accept-ai`, { method: "POST" })
      .then(() => load());

  const handleRunAiBatch = () => {
    setBatchAiBusy(true);
    setBatchAiResult(null);
    runModerationFlowAnimated(fetch("/api/admin/reviews/moderate-batch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ force: forceRerunSubmitted }),
    }))
      .then((res) => res.json())
      .then((body) => { setBatchAiResult(body); load(); })
      .catch(() => setBatchAiResult({ error: "AI moderation batch failed to run." }))
      .finally(() => setBatchAiBusy(false));
  };

  const handleEvaluateDecided = () => {
    setEvalBusy(true);
    setEvalResult(null);
    runModerationFlowAnimated(fetch("/api/admin/reviews/evaluate-decided", { method: "POST" }))
      .then((res) => res.json())
      .then((body) => { setEvalResult(body); load(); })
      .catch(() => setEvalResult({ error: "Accuracy evaluation failed to run." }))
      .finally(() => setEvalBusy(false));
  };

  const handleShowModerationFlow = () =>
    window.open(
      "/admin/reviews/how-it-works",
      "moderationHowItWorks",
      "width=480,height=760,menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes"
    );

  // CTA only shows on the Submitted tab, and only once there's at least
  // one submitted review to run it against.
  const showRunAiCta = tab === "submitted" && reviewsList && reviewsList.length > 0;

  // Accuracy eval covers ALL approved + rejected reviews together
  // server-side (not just whichever of the two tabs is open), so it's
  // offered on both - not gated on the current tab's list being non-empty,
  // since the OTHER of the two statuses may still have reviews to evaluate.
  const showEvaluateCta = tab === "approved" || tab === "rejected";

  return (
    <div className="app-frame">
      <div className="home-top" style={{ paddingBottom: 16 }}>
        <button className="back-arrow" onClick={() => { window.location.href = "/admin"; }}>‹</button>
        <div className="persona-select-title" style={{ textAlign: "left", marginTop: 10 }}>Review Moderation</div>
        <div className="persona-select-subtitle" style={{ textAlign: "left" }}>
          Approve or reject customer reviews before they show up on the storefront.
        </div>
        <button
          className="admin-resubmit-btn"
          style={{ marginTop: 10, background: "rgba(255,255,255,0.9)" }}
          onClick={handleShowModerationFlow}
        >
          Show how AI Moderation works ℹ️ (opens in new window)
        </button>
      </div>

      <div className="admin-review-tabs">
        {REVIEW_TABS.map((t) => (
          <button
            key={t.key}
            className={"admin-review-tab" + (tab === t.key ? " active" : "")}
            onClick={() => setTab(t.key)}
          >
            {t.label}
          </button>
        ))}
      </div>

      {showRunAiCta && (
        <div className="ai-run-cta-row">
          <button className="ai-run-cta-btn" disabled={batchAiBusy} onClick={handleRunAiBatch}>
            {batchAiBusy ? "Running AI Moderation..." : "🤖 Run AI Moderation Now"}
          </button>
          <label className="ai-force-rerun-label">
            <input
              type="checkbox"
              checked={forceRerunSubmitted}
              onChange={(e) => setForceRerunSubmitted(e.target.checked)}
            />
            Also re-run ones already AI-moderated
          </label>
          {batchAiResult && (
            batchAiResult.error ? (
              <div className="ai-run-cta-result ai-run-cta-result-error">{batchAiResult.error}</div>
            ) : (
              <div className="ai-run-cta-result">
                Moderated {batchAiResult.moderated} of {batchAiResult.candidates_found}
                {batchAiResult.failed > 0 ? ` (${batchAiResult.failed} failed)` : ""}.
              </div>
            )
          )}
        </div>
      )}

      {showEvaluateCta && (
        <div className="ai-run-cta-row">
          <button className="ai-run-cta-btn" disabled={evalBusy} onClick={handleEvaluateDecided}>
            {evalBusy ? "Evaluating..." : "📊 Evaluate AI Accuracy (all Approved + Rejected)"}
          </button>
          {evalResult && (
            evalResult.error ? (
              <div className="ai-run-cta-result ai-run-cta-result-error">{evalResult.error}</div>
            ) : (
              <div className="ai-run-cta-result">
                Evaluated {evalResult.evaluated} of {evalResult.candidates_found}
                {evalResult.failed > 0 ? ` (${evalResult.failed} failed)` : ""}
                {evalResult.accuracy_pct !== null && evalResult.accuracy_pct !== undefined
                  ? ` — accuracy ${evalResult.accuracy_pct}% (${evalResult.agreed} agreed, ${evalResult.disagreed} disagreed).`
                  : "."}
              </div>
            )
          )}
        </div>
      )}

      {error && <div className="home-empty">Couldn't load reviews. Is the backend running?</div>}
      {!error && reviewsList === null && <div className="home-loading">Loading reviews...</div>}
      {reviewsList && reviewsList.length === 0 && (
        <div className="cart-empty">
          <div className="cart-empty-icon">⭐</div>
          <div className="cart-empty-text">No {tab} reviews.</div>
        </div>
      )}

      {reviewsList && reviewsList.length > 0 && (
        <div className="admin-review-list">
          {reviewsList.map((r) => (
            <AdminReviewCard
              key={r.id}
              review={r}
              onApprove={handleApprove}
              onReject={handleReject}
              onResubmit={handleResubmit}
              onRunAi={handleRunAi}
              onAcceptAi={handleAcceptAi}
            />
          ))}
        </div>
      )}

      <div className="bottom-nav-spacer" />
    </div>
  );
}
