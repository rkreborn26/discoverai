// AI Review Summary tool - Retailer Admin, reachable at
// /admin/review-summary (see App() below - same ungated-by-persona
// pattern as /admin and /admin/reviews). There's no product-browsing
// UI in admin yet (Catalog is still a placeholder module - see
// ADMIN_MODULES), so this is a simple "type a product id, look it up"
// tool rather than a picker - matches how this whole feature has been
// tested against specific product ids (e.g. prod_985) throughout.
//
// Draft/publish design (agreed before building): Generate always
// writes to draft_text only - it never touches what's currently live
// (published_text) on the PDP. A moderator reviews/edits the draft,
// then explicitly hits Publish to make it live, or Unpublish to pull a
// live summary down without losing the draft underneath it.
// ---------------------------------------------------------------
// Pictogram of the Generate flow, step by step, so a moderator can see
// what happens between clicking the button and text showing up - what
// runs in the browser, what Flask does, what OpenAI does, and what
// happens with OpenAI's response. Collapsed by default (toggled from
// the page header) so it doesn't compete with the actual tool.
const REVIEW_SUMMARY_FLOW_STEPS = [
  {
    icon: "🖥️",
    title: "1. Frontend (this page, in your browser)",
    points: [
      "You click Generate / Save / Generate Review Summaries.",
      "The browser sends the product id (and edited text, if saving) to the Flask API.",
      "It waits, then renders whatever Flask sends back into the draft box and \"Live on PDP\" section.",
    ],
  },
  {
    icon: "🐍",
    title: "2. Flask API (review_summary_routes.py)",
    points: [
      "Reads that product's APPROVED, written reviews from Postgres (rejected reviews and pure star ratings with no text are excluded).",
      "Checks eligibility - 5+ reviews for a first-time summary, or 3+ new ones since the last summary for the batch tool.",
      "Builds a prompt: the product name + each review's rating and text.",
    ],
  },
  {
    icon: "🤖",
    title: "3. OpenAI API (gpt-4o-mini)",
    points: [
      "Receives that prompt over the network - it never touches your database directly.",
      "Synthesizes a short, balanced paragraph covering common praise AND common complaints, proportional to how often they appear.",
      "Sends the generated text back to Flask as its response.",
    ],
  },
  {
    icon: "💾",
    title: "4. Back in Flask, once OpenAI responds",
    points: [
      "Saves the text to Postgres as BOTH draft_text and published_text (auto-publish), plus generated_at/published_at timestamps.",
      "Sends the saved summary back to the browser as JSON.",
      "From then on, the PDP reads published_text directly on its own next load - no extra OpenAI call per customer visit.",
    ],
  },
];

// Live flow: the tool page (ReviewSummaryToolPage) and the popup
// (ReviewSummaryFlowPage) are two separate windows, so they can't share
// React state directly. BroadcastChannel lets one post "step N is active
// right now" and the other listen, even across windows/tabs on the same
// origin. If a browser doesn't support it (very rare today), the calls
// below are no-ops and the popup just shows the static diagram.
const REVIEW_SUMMARY_FLOW_CHANNEL = "review-summary-flow";

function broadcastFlowStep(step) {
  if (typeof BroadcastChannel === "undefined") return;
  try {
    const bc = new BroadcastChannel(REVIEW_SUMMARY_FLOW_CHANNEL);
    bc.postMessage({ step });
    bc.close();
  } catch (e) {
    // ignore - purely a nice-to-have visualization, never block the real action
  }
}

// Wraps a real fetch() promise so the popup lights up in step with it:
// step 0 the instant the click happens, step 1/2 while the request is
// actually in flight to Flask/OpenAI (we can't see inside that black box
// without streaming progress from the server, so both stay lit for the
// real waiting period), step 3 the moment the real response comes back,
// then it clears itself a couple seconds later.
function runFlowAnimated(fetchPromise) {
  broadcastFlowStep(0);
  const toFlask = setTimeout(() => broadcastFlowStep(1), 250);
  const toOpenAI = setTimeout(() => broadcastFlowStep(2), 700);
  return fetchPromise.finally(() => {
    clearTimeout(toFlask);
    clearTimeout(toOpenAI);
    broadcastFlowStep(3);
    setTimeout(() => broadcastFlowStep(null), 1800);
  });
}

function ReviewSummaryFlowDiagram({ activeStep }) {
  return (
    <div className="rs-flow">
      {REVIEW_SUMMARY_FLOW_STEPS.map((step, i) => (
        <React.Fragment key={step.title}>
          <div className={"rs-flow-step" + (activeStep === i ? " rs-flow-step-active" : "")}>
            <div className="rs-flow-icon">{step.icon}</div>
            <div className="rs-flow-body">
              <div className="rs-flow-title">{step.title}</div>
              <ul className="rs-flow-points">
                {step.points.map((p) => <li key={p}>{p}</li>)}
              </ul>
            </div>
          </div>
          {i < REVIEW_SUMMARY_FLOW_STEPS.length - 1 && <div className="rs-flow-arrow">↓</div>}
        </React.Fragment>
      ))}
    </div>
  );
}

// Standalone page for /admin/review-summary/how-it-works - opened in a
// separate popup window (see the "Show how this works" button below) so a
// moderator can keep it open side-by-side while working the tool page,
// rather than it pushing the tool's own content down when toggled inline.
function ReviewSummaryFlowPage() {
  const [activeStep, setActiveStep] = useState(null);

  useEffect(() => {
    if (typeof BroadcastChannel === "undefined") return undefined;
    const bc = new BroadcastChannel(REVIEW_SUMMARY_FLOW_CHANNEL);
    bc.onmessage = (event) => {
      const step = event && event.data ? event.data.step : null;
      setActiveStep(typeof step === "number" ? step : null);
    };
    return () => bc.close();
  }, []);

  return (
    <div className="app-frame">
      <div className="home-top" style={{ paddingBottom: 16 }}>
        <div className="persona-select-title" style={{ textAlign: "left", marginTop: 10 }}>
          How the AI Review Summary works
        </div>
        <div className="persona-select-subtitle" style={{ textAlign: "left" }}>
          {activeStep === null
            ? "Waiting for you to click Generate / Save / Generate Review Summaries on the tool page..."
            : `Live: step ${activeStep + 1} of ${REVIEW_SUMMARY_FLOW_STEPS.length} is happening right now.`}
        </div>
      </div>
      <div className="admin-review-list">
        <div className="admin-review-card">
          <ReviewSummaryFlowDiagram activeStep={activeStep} />
        </div>
      </div>
    </div>
  );
}

const EMPTY_SUMMARY_SECTIONS = { praises: "", criticism: "", neutral: "" };

function ReviewSummaryToolPage() {
  const [productIdInput, setProductIdInput] = useState("");
  const [loadedProductId, setLoadedProductId] = useState(null);
  const [data, setData] = useState(null); // { product, eligible_review_count, min_reviews_required, eligible, summary }
  const [sections, setSections] = useState(EMPTY_SUMMARY_SECTIONS); // editable draft, keyed by SUMMARY_SECTION_DEFS
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [batchBusy, setBatchBusy] = useState(false);
  const [batchResult, setBatchResult] = useState(null);

  const load = useCallback((productId) => {
    setError(null);
    setData(null);
    fetch(`/api/admin/products/${encodeURIComponent(productId)}/review-summary`)
      .then((res) => {
        if (!res.ok) throw new Error(res.status === 404 ? "Product not found." : "Failed to load.");
        return res.json();
      })
      .then((d) => {
        setData(d);
        setSections((d.summary && d.summary.draft) || EMPTY_SUMMARY_SECTIONS);
      })
      .catch((e) => setError(e.message || "Something went wrong."));
  }, []);

  const handleLookup = (e) => {
    e.preventDefault();
    const productId = productIdInput.trim();
    if (!productId) return;
    setLoadedProductId(productId);
    load(productId);
  };

  const runAction = (promise) => {
    setBusy(true);
    setError(null);
    return promise
      .then((res) => res.json().then((body) => ({ ok: res.ok, body })))
      .then(({ ok, body }) => {
        if (!ok) {
          setError(body.error || "Something went wrong.");
          return;
        }
        setData((prev) => ({ ...prev, summary: body.summary }));
        setSections(body.summary.draft || EMPTY_SUMMARY_SECTIONS);
      })
      .catch(() => setError("Something went wrong. Please try again."))
      .finally(() => setBusy(false));
  };

  // Generate and Save both auto-publish server-side now (see
  // review_summary_routes.py) - there's no separate confirm-and-publish
  // step in this flow anymore. Publish/Unpublish still exist as an
  // escape hatch below (e.g. pulling a summary down, or bringing the
  // current draft back live after doing so).
  const handleGenerate = () =>
    runAction(runFlowAnimated(fetch(`/api/admin/products/${encodeURIComponent(loadedProductId)}/review-summary/generate`, {
      method: "POST",
    }))).then(() => load(loadedProductId)); // refresh eligible_review_count too

  const handleSave = () =>
    runAction(fetch(`/api/admin/products/${encodeURIComponent(loadedProductId)}/review-summary`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(sections),
    }));

  const handlePublish = () =>
    runAction(fetch(`/api/admin/products/${encodeURIComponent(loadedProductId)}/review-summary/publish`, {
      method: "POST",
    }));

  const handleUnpublish = () =>
    runAction(fetch(`/api/admin/products/${encodeURIComponent(loadedProductId)}/review-summary/unpublish`, {
      method: "POST",
    }));

  const handleBatchGenerate = () => {
    setBatchBusy(true);
    setBatchResult(null);
    runFlowAnimated(fetch("/api/admin/review-summaries/batch-generate", { method: "POST" }))
      .then((res) => res.json())
      .then((body) => setBatchResult(body))
      .catch(() => setBatchResult({ error: "Batch generation failed to run." }))
      .finally(() => setBatchBusy(false));
  };

  const summary = data && data.summary;

  return (
    <div className="app-frame">
      <div className="home-top" style={{ paddingBottom: 16 }}>
        <button className="back-arrow" onClick={() => { window.location.href = "/admin"; }}>‹</button>
        <div className="persona-select-title" style={{ textAlign: "left", marginTop: 10 }}>Review Summary (AI)</div>
        <div className="persona-select-subtitle" style={{ textAlign: "left" }}>
          Only approved reviews are used. A generated (or edited) summary goes live immediately.
        </div>
        <button
          className="admin-resubmit-btn"
          style={{ marginTop: 10, background: "rgba(255,255,255,0.9)" }}
          onClick={() =>
            window.open(
              "/admin/review-summary/how-it-works",
              "reviewSummaryHowItWorks",
              "width=480,height=760,menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes"
            )
          }
        >
          Show how this works ℹ️ (opens in new window)
        </button>
      </div>

      <div className="admin-review-list">
        <div className="admin-review-card">
          <div className="admin-review-product">Batch utility</div>
          <p className="admin-review-text" style={{ marginTop: 6 }}>
            Generates (and auto-publishes) summaries for every product that either has never been
            summarized (5+ approved written reviews) or has gotten 3+ new approved written reviews
            since its last summary was generated.
          </p>
          <div className="admin-review-actions" style={{ marginTop: 6 }}>
            <button className="admin-resubmit-btn" disabled={batchBusy} onClick={handleBatchGenerate}>
              {batchBusy ? "Running..." : "Generate Review Summaries"}
            </button>
          </div>

          {batchResult && batchResult.error && (
            <div className="pdp-review-error" style={{ marginTop: 10 }}>{batchResult.error}</div>
          )}
          {batchResult && !batchResult.error && (
            <div style={{ marginTop: 10 }}>
              <div className="pdp-review-success">
                {batchResult.candidates_found === 0
                  ? "No products currently qualify."
                  : `${batchResult.generated}/${batchResult.candidates_found} summaries generated and published.`}
                {batchResult.failed > 0 ? ` ${batchResult.failed} failed.` : ""}
              </div>
              {batchResult.results.length > 0 && (
                <div className="pdp-spec-table" style={{ marginTop: 6 }}>
                  {batchResult.results.map((r) => (
                    <div className="pdp-spec-row" key={r.product_id}>
                      <span className="pdp-spec-label">{r.product_name}</span>
                      <span className="pdp-spec-value">{r.status === "generated" ? "✅ Published" : "❌ Failed"}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      </div>

      <form className="admin-review-tabs" onSubmit={handleLookup} style={{ gap: 8 }}>
        <input
          className="pdp-review-textarea"
          style={{ margin: 0, flex: 2 }}
          placeholder="Product id, e.g. prod_985"
          value={productIdInput}
          onChange={(e) => setProductIdInput(e.target.value)}
        />
        <button type="submit" className="admin-approve-btn" style={{ flex: 1 }}>Look up</button>
      </form>

      {error && <div className="pdp-review-error" style={{ margin: 16 }}>{error}</div>}

      {data && (
        <div className="admin-review-list">
          <div className="admin-review-card">
            <div className="admin-review-product">{data.product.name}</div>
            <div className="admin-review-persona">
              {data.eligible_review_count} approved written review{data.eligible_review_count === 1 ? "" : "s"}
              {" "}(needs {data.min_reviews_required}+ to generate)
            </div>

            {!data.eligible && !summary && (
              <p className="admin-review-text" style={{ marginTop: 10 }}>
                Not enough reviews yet - come back once this product has at least{" "}
                {data.min_reviews_required} approved written reviews.
              </p>
            )}

            {data.eligible && (
              <div className="admin-review-actions" style={{ marginTop: 10 }}>
                <button className="admin-resubmit-btn" disabled={busy} onClick={handleGenerate}>
                  {summary ? "Regenerate (publishes immediately)" : "Generate Summary (publishes immediately)"}
                </button>
              </div>
            )}

            {summary && (
              <React.Fragment>
                {summary.is_edited && (
                  <div className="pdp-review-hint" style={{ marginTop: 10 }}>
                    This text has been manually edited since it was last generated.
                  </div>
                )}

                <div className="checkout-section-title" style={{ marginTop: 14 }}>
                  {summary.published ? "Live on PDP (editable)" : "Draft (not published)"}
                </div>

                {SUMMARY_SECTION_DEFS.map((def) => (
                  <div key={def.key} style={{ marginBottom: 10 }}>
                    <div className="admin-review-persona" style={{ marginBottom: 4 }}>
                      {def.icon} {def.title}
                    </div>
                    <textarea
                      className="pdp-review-textarea"
                      rows={3}
                      placeholder={`(empty - nothing for "${def.title}")`}
                      value={sections[def.key] || ""}
                      onChange={(e) => setSections((prev) => ({ ...prev, [def.key]: e.target.value }))}
                    />
                  </div>
                ))}

                <div className="admin-review-actions" style={{ marginTop: 8 }}>
                  <button
                    className="admin-approve-btn"
                    disabled={
                      busy ||
                      !Object.values(sections).some((v) => (v || "").trim()) ||
                      JSON.stringify(sections) === JSON.stringify(summary.draft || EMPTY_SUMMARY_SECTIONS)
                    }
                    onClick={handleSave}
                  >
                    Save (publishes immediately)
                  </button>
                  {summary.published ? (
                    <button className="admin-reject-btn" disabled={busy} onClick={handleUnpublish}>
                      Unpublish
                    </button>
                  ) : (
                    <button className="admin-resubmit-btn" disabled={busy} onClick={handlePublish}>
                      Publish
                    </button>
                  )}
                </div>
              </React.Fragment>
            )}
          </div>
        </div>
      )}

      <div className="bottom-nav-spacer" />
    </div>
  );
}

function App() {
  const [persona, setPersona] = useState(() => loadStoredPersona());
  const [enteredStorefront, setEnteredStorefront] = useState(false);

  // /admin (and its /admin/reviews sub-page) are a separate, ungated
  // experience (Retailer Admin) - deliberately skip the persona check
  // below, checked via the raw URL rather than React Router since this
  // decision happens before BrowserRouter itself mounts (same place
  // the persona gate already lived). More specific path checked first.
  if (typeof window !== "undefined" && window.location.pathname === "/admin/reviews") {
    return <ReviewModerationPage />;
  }
  if (typeof window !== "undefined" && window.location.pathname === "/admin/reviews/how-it-works") {
    return <ModerationFlowPage />;
  }
  if (typeof window !== "undefined" && window.location.pathname === "/admin/review-summary") {
    return <ReviewSummaryToolPage />;
  }
  if (typeof window !== "undefined" && window.location.pathname === "/admin/review-summary/how-it-works") {
    return <ReviewSummaryFlowPage />;
  }
  if (typeof window !== "undefined" && window.location.pathname === "/admin") {
    return <RetailerAdminPage />;
  }

  // True landing page - only at the exact root path, and only before a
  // persona is chosen AND before Storefront has been clicked this
  // session. A returning visitor with a persona already stored skips
  // straight past it (handled by the `!persona` check below); a deep
  // link straight to e.g. /product/x also skips it, going straight to
  // PersonaSelectPage instead, since arriving via a specific link
  // implies they already know where they're headed.
  if (typeof window !== "undefined" && window.location.pathname === "/" && !persona && !enteredStorefront) {
    return <LandingPage onEnterStorefront={() => setEnteredStorefront(true)} />;
  }

  if (!persona) {
    return (
      <PersonaSelectPage
        onSelect={(p) => {
          storePersona(p);
          setPersona(p);
        }}
        onBack={() => setEnteredStorefront(false)}
      />
    );
  }

  const switchPersona = () => {
    clearStoredPersona();
    setPersona(null);
  };

  return (
    <PersonaContext.Provider value={{ persona, switchPersona }}>
      <CartProvider personaId={persona.id}>
        <BrowserRouter>
          <Routes>
            <Route path="/" element={<HomePage />} />
            <Route path="/search" element={<SearchPage />} />
            <Route path="/results" element={<ResultsPage />} />
            <Route path="/category/:categoryId" element={<PLPPage />} />
            <Route path="/product/:productId" element={<ProductDetailPage />} />
            <Route path="/cart" element={<CartPage />} />
            <Route path="/checkout" element={<CheckoutPage />} />
            <Route path="/order/:orderId" element={<OrderDetailPage />} />
            <Route path="/orders" element={<OrdersPage />} />
            <Route path="/coming-soon" element={<ComingSoonPage />} />
          </Routes>
        </BrowserRouter>
      </CartProvider>
    </PersonaContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
